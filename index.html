<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daniel Khan | Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .portfolio-container {
      width: 100%;
      max-width: 1000px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: -0.01em;
    }
    .header span {
      font-size: 0.875rem;
      color: #94a3b8;
    }
    .slide-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: calc(56.25% + 30px);
      height: 0;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #334155;
      background-color: #ffffff;
      box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.4);
    }
    .slide-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="portfolio-container">
    <div class="header">
      <h1>Daniel Khan</h1>
      <span>Engineering Portfolio</span>
    </div>
    <div class="slide-wrapper">
      <iframe 
        src="https://docs.google.com/presentation/d/e/2PACX-1vTz2Gsq18jqTEo3Zrav0B_l35FZNwdAoI0p2Gbvhin1LY3mnsenr5E1S4t07Q6FUpOWFcT9Caf6tNMr/pubembed?start=false&loop=false&delayms=3000" 
        allowfullscreen="true" 
        mozallowfullscreen="true" 
        webkitallowfullscreen="true">
      </iframe>
    </div>
  </div>
</body>
</html>
